name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Publish APK as a release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Forge.apk
          gh release create "build-${{ github.run_number }}" Forge.apk \
            --title "Forge build ${{ github.run_number }}" \
            --notes "Debug APK. Download Forge.apk on your phone and install it." \
            --latest

      - name: Publish build log (success or failure)
        if: always()
        run: |
          mkdir -p /tmp/bl
          if [ -f build.log ]; then
            tail -n 600 build.log > /tmp/bl/build-tail.log
            grep -E "^e: |^w: .*error|error:|FAILED|What went wrong|Execution failed|Could not " -A4 build.log | head -n 400 > /tmp/bl/errors.log || true
          else
            echo "no build.log produced" > /tmp/bl/build-tail.log
          fi
          echo "sha=${GITHUB_SHA} run=${GITHUB_RUN_NUMBER} status=${{ job.status }}" > /tmp/bl/status.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/bl/* .
          git add status.txt build-tail.log
          [ -f errors.log ] && git add errors.log || true
          git commit -m "build log ${GITHUB_RUN_NUMBER}"
          git push -f origin build-logs
